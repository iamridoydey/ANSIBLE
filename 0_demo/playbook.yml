---
- name: Printing the initial message
  hosts: all
  remote_user: ubuntu
  become: yes
  
  tasks:
    - name: Message from server
      ansible.builtin.shell: echo "Started configuring the server"

- name: Install apache2 to app
  hosts: app
  remote_user: ubuntu
  become: yes

  tasks:
    - name: Install apache2 server
      ansible.builtin.apt:
        name: apache2
        state: present

    - name: Start and enable apache2 service
      ansible.builtin.service:
        name: apache2
        state: started
        enabled: yes

    - name: Create custom index.html
      ansible.builtin.copy:
        content: |
          <h1>Server Details</h1>
          <p><strong>Hostname:</strong> {{ ansible_hostname }}</p>
          <p><strong>IP Address:</strong> {{ ansible_default_ipv4.address }}</p>
        dest: /var/www/html/index.html
        owner: root
        group: root
        mode: '0644'

    - name: Restart apache2 service
      ansible.builtin.service:
        name: apache2
        state: restarted

- name: Install PostgreSQL on Ubuntu
  hosts: db
  remote_user: ubuntu
  become: yes

  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: yes

    - name: Install PostgreSQL and contrib packages
      ansible.builtin.apt:
        name:
          - postgresql
          - postgresql-contrib
        state: present

    - name: Ensure PostgreSQL service is running
      ansible.builtin.service:
        name: postgresql
        state: started
        enabled: yes

    - name: Check PostgreSQL version
      ansible.builtin.shell: psql --version
      register: postgres_version
